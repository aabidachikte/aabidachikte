      animation: blink 1s infinite;
      fill: #38bdf8;
    }
  </style>

  <!-- Background Card -->
  <rect x="1.5" y="1.5" width="797" height="207" rx="14" fill="#0d1117" stroke="url(#borderGrad)" stroke-width="1.5" />
  <rect x="2" y="2" width="796" height="42" rx="12" fill="url(#glowGrad)" />

  <!-- Window Controls -->
  <circle cx="30" cy="23" r="6" fill="#ff5f56" />
  <circle cx="50" cy="23" r="6" fill="#ffbd2e" />
  <circle cx="70" cy="23" r="6" fill="#27c93f" />

