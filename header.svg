  <text x="400" y="28" text-anchor="middle" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" letter-spacing="0.5">aabidachikte ~ main</text>
  <line x1="2" y1="44" x2="798" y2="44" stroke="#21262d" stroke-width="1" />

