  <text x="35" y="80" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="0.5">const developer = &quot;Aabida Chikte&quot;;</text>
  <rect x="268" y="68" width="8" height="14" class="cursor" />

